# Configurador de Linkd en Render (sitio estático).
# Solo sirve la página web/index.html: no guarda datos ni recibe el CV ni
# inicios de sesión. Todo se genera en el navegador de quien la usa.
services:
  - type: web
    name: linkd-configurador
    runtime: static
    staticPublishPath: ./web
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'"
